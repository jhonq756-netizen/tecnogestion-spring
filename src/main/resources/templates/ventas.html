<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas - TecnoGestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h2 class="mb-4">Registro de Ventas</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h6 class="card-title">Registrar nueva venta</h6>
                <form th:action="@{/ventas/agregar}" th:object="${nuevaVenta}" method="post" class="row g-2">
                    <div class="col-md-4">
                        <select th:field="*{cliente}" class="form-select" required>
                            <option value="" disabled selected>Seleccione cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.nombre}" th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select th:field="*{producto}" class="form-select" required>
                            <option value="" disabled selected>Seleccione producto</option>
                            <option th:each="p : ${productos}" th:value="${p.nombre}" th:text="${p.nombre + ' - S/ ' + p.precio}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" min="1" th:field="*{cantidad}" class="form-control" placeholder="Cantidad" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Total (S/)</th>
                    <th>Fecha</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${ventas}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.cliente}"></td>
                    <td th:text="${v.producto}"></td>
                    <td th:text="${v.cantidad}"></td>
                    <td th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></td>
                    <td th:text="${v.fecha}"></td>
                    <td>
                        <a th:href="@{/ventas/eliminar/{id}(id=${v.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar esta venta?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
