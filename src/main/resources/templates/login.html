<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion - TecnoGestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow login-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-1">TecnoGestion S.A.C.</h3>
            <p class="text-center text-muted mb-4">Sistema de Gestion Comercial</p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="usuario" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <p class="text-muted small mt-3 mb-0 text-center">
                Usuario de prueba: <strong>admin</strong> / Contrasena: <strong>admin123</strong>
            </p>
        </div>
    </div>
</body>
</html>
