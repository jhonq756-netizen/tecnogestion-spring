<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - TecnoGestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h2 class="mb-4">Gestion de Clientes</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h6 class="card-title">Registrar nuevo cliente</h6>
                <form th:action="@{/clientes/agregar}" th:object="${nuevoCliente}" method="post" class="row g-2">
                    <div class="col-md-3">
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre / Razon social" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" th:field="*{documento}" class="form-control" placeholder="RUC / DNI" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Telefono">
                    </div>
                    <div class="col-md-3">
                        <input type="email" th:field="*{correo}" class="form-control" placeholder="Correo">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Agregar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Telefono</th>
                    <th>Correo</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.documento}"></td>
                    <td th:text="${c.telefono}"></td>
                    <td th:text="${c.correo}"></td>
                    <td>
                        <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este cliente?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
