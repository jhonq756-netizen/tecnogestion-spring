<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - TecnoGestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h2 class="mb-4">Hola, <span th:text="${nombreUsuario}">Usuario</span> 👋</h2>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="card text-bg-primary shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Clientes</h6>
                        <p class="fs-2 mb-0" th:text="${totalClientes}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-success shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Productos</h6>
                        <p class="fs-2 mb-0" th:text="${totalProductos}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-warning shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Ventas registradas</h6>
                        <p class="fs-2 mb-0" th:text="${totalVentas}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-dark shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Ingresos totales</h6>
                        <p class="fs-2 mb-0">S/ <span th:text="${#numbers.formatDecimal(totalIngresos, 1, 2)}">0.00</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h5>Modulos del sistema</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <a href="/clientes" class="text-decoration-none">
                        <div class="card shadow-sm p-3">Gestion de Clientes</div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/productos" class="text-decoration-none">
                        <div class="card shadow-sm p-3">Gestion de Productos</div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/ventas" class="text-decoration-none">
                        <div class="card shadow-sm p-3">Registro de Ventas</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
