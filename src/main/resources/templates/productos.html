<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - TecnoGestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container">
        <h2 class="mb-4">Gestion de Productos</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h6 class="card-title">Registrar nuevo producto</h6>
                <form th:action="@{/productos/agregar}" th:object="${nuevoProducto}" method="post" class="row g-2">
                    <div class="col-md-3">
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre del producto" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" th:field="*{categoria}" class="form-control" placeholder="Categoria">
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="Precio" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" th:field="*{stock}" class="form-control" placeholder="Stock" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Agregar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoria</th>
                    <th>Precio (S/)</th>
                    <th>Stock</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria}"></td>
                    <td th:text="${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                    <td th:text="${p.stock}"></td>
                    <td>
                        <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este producto?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
